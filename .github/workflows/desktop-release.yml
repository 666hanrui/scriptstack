name: Desktop Release Packages

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Public ScriptStack API base URL"
        required: true
        default: "https://544834.xyz"
  push:
    tags:
      - "v*"

env:
  VITE_API_BASE: ${{ github.event.inputs.api_base || 'https://544834.xyz' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mac-universal:
    name: macOS Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run frontend:typecheck

      - name: Build universal macOS app
        run: npm run tauri:build:remote:mac-universal

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: ScriptStack-macOS-universal
          path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/macos/*.app
          if-no-files-found: error

  windows-x64:
    name: Windows x64 Installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run frontend:typecheck

      - name: Build Windows x64 app
        run: npm run tauri:build:remote:windows-x64

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: ScriptStack-Windows-x64
          path: |
            target/**/bundle/msi/*.msi
            target/**/bundle/nsis/*.exe
          if-no-files-found: error
