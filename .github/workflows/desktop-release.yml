name: Desktop Release Packages

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Public ScriptStack API base URL"
        required: true
        default: "http://49.235.153.151"
      release_tag:
        description: "Optional GitHub Release tag to publish after packaging"
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  VITE_API_BASE: ${{ github.event.inputs.api_base || 'http://49.235.153.151' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mac-universal:
    name: macOS Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run frontend:typecheck

      - name: Build universal macOS app
        run: npm run tauri:build:remote:mac-universal

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: ScriptStack-macOS-universal
          path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/macos/*.app
          if-no-files-found: error

  windows-x64:
    name: Windows x64 Installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run frontend:typecheck

      - name: Build Windows x64 app
        run: npm run tauri:build:remote:windows-x64

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: ScriptStack-Windows-x64
          path: |
            target/**/bundle/msi/*.msi
            target/**/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [mac-universal, windows-x64]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ScriptStack ${{ github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ScriptStack ${{ github.event.inputs.release_tag }} beta package.

            - API base: ${{ env.VITE_API_BASE }}
            - Windows x64: MSI + EXE
            - macOS: Universal DMG for Apple Silicon and Intel
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
