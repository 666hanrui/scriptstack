[package]
name = "scriptstack"
version = "3.0.0"
edition = "2021"
description = "剧本栈 ScriptStack — AI 驱动的剧本创作与影视化工具（桌面客户端薄壳）"

[lib]
name = "scriptstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"

# 文件解析（select_text_file 仍需本地解析能力）
chardetng = "0.1"
encoding_rs = "0.8"
sha2 = "0.10"
hex = "0.4"
pdf-extract = "0.7"
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex-lite = "0.1"
